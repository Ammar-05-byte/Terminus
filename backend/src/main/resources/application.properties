spring.application.name=railway-reservation-system

# Oracle DataSource Configuration
spring.datasource.url=${ORACLE_URL:jdbc:oracle:thin:@localhost:1521/FREEPDB1}
spring.datasource.username=${ORACLE_USER:railway_user}
spring.datasource.password=${ORACLE_PASSWORD:railway_pass}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# HikariCP Connection Pool Settings
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.pool-name=RailwayHikariCP

# Server Port
server.port=8080

# JSON Date/Time Formatting
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=UTC
spring.jackson.serialization.write-dates-as-timestamps=false

# Logging Configuration
logging.level.root=INFO
logging.level.com.railway.reservation=DEBUG
logging.level.org.springframework.jdbc.core.JdbcTemplate=DEBUG
